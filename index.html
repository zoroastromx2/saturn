<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Saturno</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <div id="loader" data-i18n="loader.loading">
      Cargando datos de la misión Cassini...
    </div>
    <div id="ui-container">
      <header id="app-header">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
          <circle cx="24" cy="24" r="12.5" />
          <circle cx="24" cy="24" r="3.5" />
          <path d="M24 1v11M24 36v11M1 24h11M36 24h11" />
        </svg>
        <div class="brand-copy">
          <h1 data-i18n="app.title">Simulador de Saturno</h1>
          <p data-i18n="app.subtitle">Observatorio volumétrico de Saturno / 01</p>
        </div>
      </header>
      <div id="telemetry-hud">
        <div class="panel-label">
          <span data-i18n="console.telemetry">Telemetría</span>
          <span class="panel-index">01</span>
        </div>
        <span class="telemetry-label" data-i18n="telemetry.target">Objetivo activo</span>
        <span id="telemetry-target" class="telemetry-value">Saturno</span>
        <span class="telemetry-label" data-i18n="telemetry.altitude">Altitud de superficie</span>
        <span id="telemetry-altitude" class="telemetry-value">0 km</span>
        <span class="telemetry-label" data-i18n="telemetry.period">Período orbital</span>
        <span id="telemetry-period" class="telemetry-value">—</span>
      </div>
      <nav id="hud">
        <div class="panel-label">
          <span data-i18n="console.navigation">Controles</span>
          <span class="panel-label-meta">
            <button id="btn-toggle-aurora" class="panel-toggle active" type="button" aria-pressed="true">Auroras: ON</button>
            <span class="panel-index">03</span>
          </span>
        </div>
        <button id="btn-saturn" data-i18n="nav.focusSaturn">Ir a Saturno</button>
        <button id="btn-earth" data-i18n="nav.focusEarth">Ir a Tierra</button>
        <button id="btn-titan" data-i18n="nav.focusTitan">Ir a Titán</button>
        <button id="btn-enceladus" data-i18n="nav.focusEnceladus">Ir a Encélado</button>
        <button id="btn-mimas" data-i18n="nav.focusMimas">Ir a Mimas</button>
        <button id="btn-surface-enceladus" data-i18n="nav.landEnceladus">Aterrizar en Encélado</button>
        <button id="btn-surface-mimas" data-i18n="nav.landMimas">Aterrizar en Mimas</button>
        <button id="btn-toggle-labels" data-i18n="nav.showLabels">Mostrar etiquetas</button>
        <button id="btn-toggle-audio" data-i18n="nav.enableAudio">Activar audio</button>
        <button id="btn-toggle-language" data-i18n="language.toggle" data-i18n-aria-label="language.toggleAria" aria-label="Cambiar a inglés">Idioma · EN</button>
      </nav>
      <div id="time-controls" role="group" aria-label="Controles de tiempo orbital" data-i18n-aria-label="time.controlsAria">
        <div class="panel-label">
          <span data-i18n="console.time">Tiempo orbital</span>
          <span class="panel-index">02</span>
        </div>
        <button id="btn-time-pause" aria-pressed="false" data-i18n="time.pause">|| Pausa</button>
        <button id="btn-time-1" class="active" aria-pressed="true">&gt; x1</button>
        <button id="btn-time-10" aria-pressed="false">&gt;&gt; x10</button>
        <button id="btn-time-100" aria-pressed="false">&gt;&gt;&gt; x100</button>
      </div>
    </div>
    <button id="btn-toggle-ui" type="button" aria-controls="ui-container" aria-expanded="true" aria-label="Ocultar controles" title="Ocultar controles">
      <svg class="ui-toggle-icon ui-icon-menu" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 5h14M3 10h14M3 15h14" />
      </svg>
      <svg class="ui-toggle-icon ui-icon-close" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M4 4l12 12M16 4L4 16" />
      </svg>
    </button>
    <canvas id="webgl-canvas"></canvas>	
  </body>
</html>
